<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Box Model Lab</title>
<style>
/*Add a solid 5 pixel blue border to the .box element.*/
/*Add 20 px of padding to the .box element.*/
/*Add a 20 px margin to the .box element.*/
/*Change the box-sizing property:*/
/*Change it to border-box and note the difference.*/
/*Add a background color to the .box element.*/
.box {     
    margin: 20px;     
    padding: 20px;     
    border: 5px solid royalblue;     
    box-sizing: border-box;     
    background-color: gainsboro; 
    width: 50%;
    height: 50%;
}

</style>
</head>
<body>
<h1>CSS Box Model Lab</h1>
<div class="box">
<p>This is a demonstration of the CSS Box Model.</p>
</div>
<div class="box">
<p>This is a second box to display effects of CSS and margin collapsing.</p>
</div>
</body>
</html>
